name: Fly certificates

# Ensure the Fly app has a TLS certificate for every chata custom domain.
# Run manually (Actions → Fly certificates → Run workflow) after adding a
# domain in the admin and pointing its DNS at the app. With no input it
# syncs ALL domains found in the production API; pass a hostname to
# process just that one.
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Single hostname to process (leave empty to sync all chata domains)'
        required: false
        type: string

jobs:
  certificates:
    name: Ensure certificates
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Collect domains
        run: |
          if [ -n "${{ inputs.hostname }}" ]; then
            echo "${{ inputs.hostname }}" > domains.txt
          else
            curl -sf "https://zicha.travel/api/chatas?limit=200&depth=0" \
              | jq -r '.docs[].domains[]?.domain // empty' | sort -u > domains.txt
          fi
          echo "Domains to ensure:"
          cat domains.txt
      - name: Existing certificates
        run: flyctl certs list -a split-expanses
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Add missing certificates
        run: |
          while read -r d; do
            [ -z "$d" ] && continue
            echo "::group::$d"
            flyctl certs add "$d" -a split-expanses \
              || echo "certificate already exists (or add failed) — status follows"
            flyctl certs check "$d" -a split-expanses \
              || echo "NOTE: $d not fully issued yet — DNS must point at the app; re-run to re-check"
            echo "::endgroup::"
          done < domains.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Final certificate status
        run: flyctl certs list -a split-expanses
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
