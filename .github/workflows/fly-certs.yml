name: Fly certificate

# Provision a TLS certificate on the Fly app for a chata custom domain.
# Run manually (Actions → Fly certificate → Run workflow) after pointing
# the domain's DNS at the app and adding it to the chata in the admin.
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Hostname to issue a certificate for (e.g. lazne.zicha.travel)'
        required: true
        type: string

jobs:
  certificate:
    name: Add certificate
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Add certificate (idempotent)
        run: flyctl certs add "${{ inputs.hostname }}" -a split-expanses || flyctl certs show "${{ inputs.hostname }}" -a split-expanses
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check certificate status
        run: flyctl certs check "${{ inputs.hostname }}" -a split-expanses
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
