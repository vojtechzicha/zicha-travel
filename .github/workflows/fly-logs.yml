name: Fly logs

# Fetch recent logs from the Fly app (read-only diagnostics).
on:
  workflow_dispatch:

jobs:
  logs:
    name: Recent logs
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: App status
        run: flyctl status -a split-expanses
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Recent logs
        run: flyctl logs -a split-expanses --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
